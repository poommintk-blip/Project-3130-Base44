---
# ขั้นที่ 5.2: ติดตั้ง k3s บน server แล้วให้ worker เข้าร่วม cluster
# รันซ้ำได้: ถ้าติดตั้งแล้ว (มีไฟล์ k3s อยู่) จะข้ามไป
- name: Install the k3s server
  hosts: server
  become: true
  gather_facts: false
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --node-external-ip {{ ansible_host }}" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for the join token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read the join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_file

    - name: Keep the token for the workers
      ansible.builtin.set_fact:
        k3s_token: "{{ token_file.content | b64decode | trim }}"

- name: Join the workers to the cluster
  hosts: workers
  become: true
  gather_facts: false
  vars:
    server_ip: "{{ hostvars['server1'].private_ip }}"
    k3s_token: "{{ hostvars['server1'].k3s_token }}"
  tasks:
    - name: Install k3s agent
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL="https://{{ server_ip }}:6443" K3S_TOKEN="{{ k3s_token }}" sh -
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh
      no_log: true

- name: Check that every node is Ready
  hosts: server
  become: true
  gather_facts: false
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.shell: k3s kubectl get nodes --no-headers | awk '$2=="Ready"' | wc -l
      register: ready_nodes
      until: ready_nodes.stdout | int == (groups['workers'] | length + 1)
      retries: 30
      delay: 10
      changed_when: false

    - name: Show the nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
