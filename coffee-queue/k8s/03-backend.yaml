# Backend: Node.js API รัน 2 ตัว (HPA เพิ่มได้ถึง 5) Service กระจาย request ให้ทุกตัว = Load Balance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: coffee-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: DOCKERHUB_USER/coffee-backend:APP_VERSION
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: coffee-config
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: coffee-secret, key: PGPASSWORD } }
            - name: STAFF_PIN
              valueFrom: { secretKeyRef: { name: coffee-secret, key: STAFF_PIN } }
          resources:              # HPA ใช้ค่า requests คำนวณว่า CPU สูงแค่ไหน
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:          # แอปค้าง -> Kubernetes restart ให้
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:         # DB ยังไม่พร้อม -> ยังไม่ส่ง traffic มา
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend               # ชื่อนี้ nginx.conf ใช้ (proxy_pass http://backend:3000)
  namespace: coffee-queue
spec:
  selector:
    app: backend
  ports:
    - port: 3000
