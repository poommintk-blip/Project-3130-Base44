# Gateway: ทางเข้าเดียวจากข้างนอก (พอร์ต 80 ของทุกเครื่อง) ผ่าน Traefik ที่มากับ k3s
#   /api  -> backend
#   /     -> frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coffee-ingress
  namespace: coffee-queue
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
