# Frontend: Nginx + หน้าเว็บ รัน 2 ตัว
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: coffee-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USER/coffee-frontend:APP_VERSION
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: coffee-queue
spec:
  selector:
    app: frontend
  ports:
    - port: 80
