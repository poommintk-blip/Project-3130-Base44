# Database: PostgreSQL 1 ตัว แบบ StatefulSet เก็บข้อมูลใน PVC (ดิสก์ถาวร)
# ลบ pod แล้ว Kubernetes สร้างใหม่และต่อดิสก์เดิม ข้อมูลจึงไม่หาย
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: coffee-queue
spec:
  type: ClusterIP           # ใช้ได้เฉพาะในระบบ ไม่เปิดออกข้างนอก
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: coffee-queue
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: coffee-config, key: PGUSER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: coffee-config, key: PGDATABASE } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: coffee-secret, key: PGPASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "coffee"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path   # storage ที่มากับ k3s
        resources:
          requests:
            storage: 1Gi
